<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta description="Descrição">


  <title>Exercício 15</title>


  <link rel="icon" type="image/x-icon" href="./Js Icon.png" />
  <link rel="stylesheet" href="./style.css">


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">




</head>

<body>

  <div class="container mt-5">
    <h1 class="text-center">Agenda de Contatos</h1>
    <div class="row">
      <div class="col">
        <form class="mx-auto p5 w-50">
          <label class="form-label">Nome</label>
          <input class="form-control" id="nome">

          <label class="form-label">E-mail</label>
          <input class="form-control" type="email" id="email">

          <label class="form-label">Telefone</label>
          <input class="form-control" type="email" id="telefone">

          <label class="form-label">URL da foto</label>
          <input class="form-control" id="foto" id='foto'>

          <button class="btn btn-primary w-100 mt-4" id="btSalvar" type="button">Salvar</button>
        </form>
      </div>
    </div>


    <div id="listaDeContatos">

    </div>


    <div style="width: 300px;height: 120px;justify-content: space-between; background-color: rgb(68, 68, 68); border-radius: 10px; padding: 20px;display: flex; flex-direction: column;position: fixed;
    top: 30%;
    left: 42%;display: none; "
    
    id="popup">

      <strong style="font-size: 1.2rem; align-self: center; color:white">Preencha todos os campos!</strong>


      <button
        style="width: 200px; align-self: center;background-color: rgb(52, 113, 235);color: white;border: none;border-radius: 8px;height: 30px; cursor: pointer;"
       
        id="closePop" type="button">Ok</button>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
    <script src="./app.js"></script>




</body>

</html>
