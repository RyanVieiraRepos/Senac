<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta author="Ryan Vieira Assumpção">
  <meta description="Descrição">


  <title>Objetos</title>



  <link rel="icon" type="image/x-icon" href="./Js Icon.png" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


</head>

<body class="bg-dark text-white justify-content-center align-items-center d-flex flex-column " >

  <form class="d-flex flex-column mt-5" id="form">
    <input placeholder="Nome do Filme" class="p-2 rounded h5 mb-4 text-black" id="nome">
    <input placeholder="Link da foto da Capa" class="p-2 rounded h5 mb-4 text-black" id="linkFoto">

    <div class="d-flex flex-row mb-4">
      <input placeholder="Ano" class="p-2 rounded h5 me-2 text-black" id="ano">
      <select class="form-select ms-2" aria-label="Default select example" id="select">
        
        <option value="⭐">⭐</option>
        <option value="⭐⭐">⭐⭐</option>
        <option value="⭐⭐⭐">⭐⭐⭐</option>
        <option value="⭐⭐⭐⭐">⭐⭐⭐⭐</option>
        <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐</option>
      </select>
    </div>

    <input placeholder="Link do Trailer " class="p-2 rounded h5 mb-4 text-black" id="linkTrailer">

    <div class="d-flex flex-row mb-4 mt-3">
      <input placeholder="Gênero" class="p-2 rounded h5 me-2 text-black" id="genero">
      <input placeholder="Duração" class="p-2 rounded h5 ms-2 text-black" id="duracao">
    </div>
    <textarea placeholder="Descrição" class="p-2 rounded h5 mb-5 text-black" id="desc"></textarea>

    <button type="button" class="btn btn-primary" id="saveBtn">Salvar</button>
  </form>


 
  <div class="col-12 d-flex flex-wrap justify-content-center mt-5" id="lista">
  
    

  </div>






  <div style="width: 300px;height: 120px;justify-content: space-between; background-color: rgb(68, 68, 68); border-radius: 10px; padding: 20px;display: flex; flex-direction: column;position: fixed;
    top: 30%;
    left: 42%;display: none; " id="popup">

    <strong class="h5">Preencha todos os campos!</strong>


    <button class="btn btn-danger" id="closePop" type="button">Ok</button>
  </div>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="./app.js"></script>




</body>

</html>
